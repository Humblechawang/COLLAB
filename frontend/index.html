<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Collab helps builder teams turn projects, research, and milestones into a polished public portfolio and private team workspace.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Collab — The Team Portfolio Platform">
<meta property="og:type" content="website">
<link rel="canonical" href="https://collab.app/">
<title>Collab — The Team Portfolio Platform</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  --page-max: 1180px;
  --bg: #ffffff;
  --alt: #f5f5f7;
  --alt-card: #fbfbfd;
  --ink: #1d1d1f;
  --ink-secondary: #48484a;
  --mute: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.14);
  --blue: #0071e3;
  --blue-hover: #0077ed;
  --blue-glow: rgba(0, 113, 227, 0.28);
  --soft: #f0f7ff;
  --soft-line: rgba(0, 113, 227, 0.15);
  --green: #34c759;
  --green-soft: #eafbf0;
  --amber: #ff9500;
  --amber-soft: #fff8eb;
  --rose: #ff2d55;
  --purple: #af52de;
  --purple-soft: #fbf0ff;
  --glass: rgba(255, 255, 255, 0.84);
  --e: cubic-bezier(0.16, 1, 0.3, 1);
  --sh-subtle: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --sh: 0 8px 24px -4px rgba(0, 0, 0, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
  --sh-lg: 0 20px 48px -6px rgba(0, 0, 0, 0.09), 0 8px 16px -2px rgba(0, 0, 0, 0.04);
  --sh-frame: 0 32px 84px -12px rgba(0, 0, 0, 0.12), 0 12px 32px -4px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --f: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.55 var(--f);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 3px; border-radius: 12px; }

/* Grid Container */
.w { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.035em; line-height: 1.08; color: var(--ink); font-weight: 700; }
h1 { font-size: clamp(40px, 7.2vw, 82px); }
h2 { font-size: clamp(28px, 4.6vw, 52px); }
h3 { font-size: 22px; letter-spacing: -0.02em; }
h4 { font-size: 15px; letter-spacing: -0.01em; font-weight: 650; }

.lead {
  font-size: clamp(18px, 2.2vw, 23px);
  color: var(--mute);
  line-height: 1.45;
  letter-spacing: -0.012em;
  max-width: 40ch;
  margin: 18px auto 0;
  font-weight: 450;
}

.gradient-text {
  background: linear-gradient(135deg, #1d1d1f 25%, #0071e3 90%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Badges & Pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  padding: 4px 12px;
  border-radius: 9999px;
  background: var(--soft);
  color: var(--blue);
  border: 1px solid var(--soft-line);
}
.pill.g { background: var(--green-soft); color: #0f8644; border-color: rgba(52, 199, 89, 0.2); }
.pill.a { background: var(--amber-soft); color: #b26500; border-color: rgba(255, 149, 0, 0.2); }
.pill.p { background: var(--purple-soft); color: #8e24aa; border-color: rgba(175, 82, 222, 0.2); }

.pill-intro {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  color: var(--blue);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 9999px;
  margin-bottom: 22px;
  border: 1px solid var(--soft-line);
  transition: transform 0.3s var(--e);
}
.pill-intro:hover { transform: translateY(-1px); }

/* Navigation Bar */
.nav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--line);
}
.nav .w {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  max-width: var(--page-max);
}
.brand {
  font-weight: 800;
  font-size: 18px;
  display: flex;
  gap: 8px;
  align-items: center;
  letter-spacing: 0;
  color: var(--ink);
}
.brand .logo {
  width: 40px;
  height: 40px;
  display: block;
  flex: none;
  transition: transform 0.35s var(--e);
}
.brand-name { font-size: 28px; font-weight: 800; line-height: 1; }
.brand:hover .logo { transform: rotate(10deg) scale(1.05); }
.brand .badge {
  font-size: 11px;
  font-weight: 650;
  padding: 2px 7px;
  border-radius: 9999px;
  background: var(--alt);
  color: var(--mute);
  border: 1px solid var(--line);
}
.nl {
  display: flex;
  gap: 28px;
  color: var(--mute);
  font-size: 14.5px;
  font-weight: 500;
}
.nl a {
  position: relative;
  transition: color 0.25s var(--e);
  padding: 6px 0;
}
.nl a:hover, .nl a.active { color: var(--ink); font-weight: 600; }
.nl a.active::after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 2px;
  border-radius: 2px;
  background: var(--blue);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Mobile Nav Drawer */
.mob-btn {
  display: none;
  padding: 8px;
  color: var(--ink);
  font-size: 20px;
  border-radius: 10px;
  min-width: 42px;
  min-height: 42px;
}
.mob-drawer {
  display: none;
  position: fixed;
  top: 58px;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  z-index: 99;
  padding: 24px;
  flex-direction: column;
  gap: 16px;
  animation: fade 0.25s var(--e);
}
.mob-drawer a {
  font-size: 19px;
  font-weight: 650;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 9999px;
  padding: 12px 24px;
  font-weight: 600;
  font-size: 15px;
  background: var(--blue);
  color: #ffffff;
  transition: transform 0.35s var(--e), box-shadow 0.35s var(--e), background 0.2s;
  box-shadow: 0 4px 14px rgba(0, 113, 227, 0.22);
}
.btn:hover {
  transform: translateY(-2px);
  background: var(--blue-hover);
  box-shadow: 0 8px 24px rgba(0, 113, 227, 0.32);
}
.btn:active { transform: scale(0.97); }
.btn.g {
  background: rgba(0, 0, 0, 0.05);
  color: var(--ink);
  box-shadow: none;
}
.btn.g:hover {
  background: rgba(0, 0, 0, 0.08);
  box-shadow: none;
}
.btn.sm { padding: 8px 18px; font-size: 13.5px; }
.btn.full { width: 100%; }

.pill-intro,
.aud-tab,
.showcase-tab,
.fc,
.btn,
.nav a,
.mob-btn {
  -webkit-tap-highlight-color: transparent;
}

/* Hero Section */
.hero {
  text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 0 36px;
  overflow: hidden;
  min-height: 94svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cta {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 32px;
}

/* High Fidelity Apple Device Frame */
.frame {
  margin: clamp(48px, 7vw, 84px) auto 0;
  max-width: 960px;
  width: 100%;
  border-radius: 32px;
  background: #ffffff;
  border: 1px solid var(--line-strong);
  box-shadow: var(--sh-frame);
  padding: 0;
  overflow: hidden;
  text-align: left;
  transform: scale(0.96);
  transform-origin: top center;
  will-change: transform;
}
.window-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  background: #ffffff;
  border-bottom: 1px solid var(--line);
}
.dots { display: flex; gap: 7px; align-items: center; }
.dots i { width: 11px; height: 11px; border-radius: 50%; }
.dots i:nth-child(1) { background: #ff5f56; }
.dots i:nth-child(2) { background: #ffbd2e; }
.dots i:nth-child(3) { background: #27c93f; }
.win-url {
  background: var(--alt);
  padding: 4px 16px;
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 6px;
  width: 320px;
  justify-content: center;
  max-width: 60%;
}
.win-actions { width: 48px; }

/* Real Product Showcase Inner */
.prod-hero {
  background: #ffffff;
  position: relative;
}
.prod-cover {
  height: 200px;
  position: relative;
  overflow: hidden;
}
.prod-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.prod-cover-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%);
}
.prod-body {
  padding: 0 30px 28px;
  position: relative;
}
.prod-avatar-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: -42px;
  margin-bottom: 16px;
  position: relative;
  z-index: 2;
}
.prod-avatar {
  width: 80px;
  height: 80px;
  border-radius: 22px;
  border: 4px solid #ffffff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  overflow: hidden;
  background: var(--blue);
}
.prod-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prod-info h3 { font-size: 26px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.prod-info p { color: var(--mute); margin: 0 0 16px; font-size: 15px; }

/* Interactive Showcase Tabs */
.showcase-nav {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 16px;
}
.showcase-tab {
  font-size: 13.5px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 9999px;
  color: var(--mute);
  transition: all 0.2s var(--e);
}
.showcase-tab.on {
  background: var(--ink);
  color: #ffffff;
}

.prod-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 14px;
}
.prod-card {
  background: var(--alt);
  border-radius: 18px;
  padding: 16px;
  border: 1px solid rgba(0,0,0,0.04);
  display: flex;
  gap: 14px;
  align-items: center;
  transition: transform 0.3s var(--e);
}
.prod-card:hover { transform: translateY(-2px); }
.prod-card img {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  object-fit: cover;
  flex: none;
}
.prod-card b { display: block; font-size: 15px; margin-bottom: 3px; }
.prod-card small { color: var(--mute); display: block; font-size: 13px; line-height: 1.35; }

/* Section Spacing & Hierarchy */
sec, .sec {
  display: block;
  padding: clamp(80px, 11vw, 140px) 0;
  text-align: center;
}
.sec.alt { background: var(--alt); }
.big {
  font-size: clamp(34px, 5.8vw, 68px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.1;
  max-width: 18ch;
  margin: 0 auto;
}

/* Built For Everyone (Interactive High-Intensity Section) */
.aud-selector {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 36px 0 24px;
  flex-wrap: wrap;
}
.aud-tab {
  padding: 10px 22px;
  border-radius: 9999px;
  font-weight: 650;
  font-size: 15px;
  color: var(--mute);
  background: #ffffff;
  border: 1px solid var(--line);
  transition: all 0.25s var(--e);
}
.aud-tab:hover { color: var(--ink); border-color: var(--line-strong); }
.aud-tab.on {
  background: var(--ink);
  color: #ffffff;
  border-color: var(--ink);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}

.aud-detail-box {
  background: #ffffff;
  border-radius: 32px;
  border: 1px solid var(--line);
  padding: clamp(28px, 5vw, 44px);
  box-shadow: var(--sh);
  text-align: left;
  margin-top: 18px;
  animation: up 0.4s var(--e);
}
.aud-detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 36px;
  align-items: center;
}
.aud-problem {
  background: var(--alt);
  border-radius: 20px;
  padding: 22px;
  border-left: 4px solid var(--rose);
}
.aud-problem b { color: var(--rose); font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }
.aud-solution {
  background: var(--soft);
  border-radius: 20px;
  padding: 22px;
  border-left: 4px solid var(--blue);
  margin-top: 14px;
}
.aud-solution b { color: var(--blue); font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }
.aud-features-list {
  display: grid;
  gap: 12px;
  margin-top: 20px;
}
.aud-feature-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 15px;
  color: var(--ink-secondary);
}
.aud-feature-item span {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  flex: none;
  margin-top: 2px;
}

/* Sticky Chapter Section (Apple Keynote Style) */
.chap { height: 320vh; position: relative; }
.stk {
  position: sticky;
  top: 58px;
  height: calc(100vh - 58px);
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 56px;
  align-items: center;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
  text-align: left;
}
.txt, .vis { position: relative; height: 64vh; }
.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  filter: blur(14px);
  transform: translateY(40px) scale(0.94);
  transition: opacity 0.75s var(--e), transform 0.85s var(--e), filter 0.75s var(--e);
  pointer-events: none;
}
.slide.on {
  opacity: 1;
  filter: none;
  transform: none;
  pointer-events: auto;
}
.lead2 { font-size: clamp(18px, 2.2vw, 22px); color: var(--mute); line-height: 1.45; margin: 16px 0 0; }
.frame2 {
  border-radius: 30px;
  padding: 24px;
  border: 1px solid var(--line);
  box-shadow: var(--sh-lg);
  background: #ffffff;
  width: 100%;
}

/* Stories Grid */
.sto {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 48px;
  text-align: left;
}
.sc {
  display: flex;
  flex-direction: column;
  border-radius: 26px;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid var(--line);
  box-shadow: var(--sh-subtle);
  transition: transform 0.5s var(--e), box-shadow 0.5s var(--e);
}
.sc:hover {
  transform: translateY(-8px);
  box-shadow: var(--sh-lg);
}
.sc .cv {
  height: 200px;
  overflow: hidden;
  position: relative;
}
.sc .cv img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.8s var(--e);
}
.sc:hover .cv img { transform: scale(1.06); }
.sc .b { padding: 24px; flex: 1; display: flex; flex-direction: column; }
.sc small {
  color: var(--blue);
  font-size: 12.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.sc h3 { margin-top: 8px; font-size: 19px; line-height: 1.35; }

/* 3-Step Setup */
.steps { display: grid; gap: 16px; margin-top: 44px; text-align: left; }
.step {
  display: flex;
  gap: 20px;
  align-items: center;
  background: #ffffff;
  border-radius: 24px;
  padding: 24px;
  box-shadow: var(--sh-subtle);
  border: 1px solid var(--line);
  transition: transform 0.35s var(--e);
}
.step:hover { transform: translateX(6px); }
.step b {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--blue);
  color: #ffffff;
  display: grid;
  place-items: center;
  flex: none;
  font-size: 17px;
  font-weight: 700;
}
.step span { font-size: 17.5px; font-weight: 600; color: var(--ink); }

/* FAQ Accordion */
.fq {
  background: #ffffff;
  border-radius: 22px;
  margin-bottom: 12px;
  overflow: hidden;
  text-align: left;
  border: 1px solid var(--line);
  box-shadow: var(--sh-subtle);
  transition: border-color 0.3s;
}
.fq.open { border-color: var(--line-strong); }
.fq > button {
  width: 100%;
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 18px;
  text-align: left;
}
.fq > button span {
  font-size: 22px;
  transition: transform 0.4s var(--e);
  color: var(--blue);
}
.fq.open > button span { transform: rotate(45deg); }
.fa {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.45s var(--e);
}
.fq.open .fa { grid-template-rows: 1fr; }
.fa > div { overflow: hidden; }
.fa p { margin: 0; padding: 0 24px 24px; color: var(--mute); font-size: 16px; line-height: 1.5; }

/* Realistic 3D Motion Canvas Globe */
.gwrap { margin-top: clamp(24px, 4vw, 44px); will-change: transform, opacity; }
.globe {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: gin 1.2s var(--e) both;
}
.globe canvas {
  cursor: grab;
  touch-action: pan-y;
  max-width: 100%;
  filter: drop-shadow(0 30px 60px rgba(0, 113, 227, 0.25));
}
.globe canvas:active { cursor: grabbing; }
.globe p { color: var(--mute); font-size: 14px; margin: 14px 0 0; font-weight: 550; letter-spacing: -0.01em; }
@keyframes gin { from { opacity: 0; transform: scale(0.85) translateY(24px); filter: blur(8px); } }

/* App Dashboard */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
  background: var(--alt);
}
.mobile-app-header { display: none; }
.side {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.side .brand { padding: 0 10px 20px; }
.ti {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-radius: 14px;
  color: var(--mute);
  font-weight: 600;
  font-size: 14.5px;
  text-align: left;
  transition: all 0.25s var(--e);
}
.ti:hover { background: var(--alt); color: var(--ink); transform: translateX(3px); }
.ti.on { background: var(--soft); color: var(--blue); }
.pane {
  padding: clamp(24px, 5vw, 52px);
  max-width: 980px;
  width: 100%;
  animation: up 0.5s var(--e);
}
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
.pane h2 { font-size: clamp(28px, 4vw, 42px); }
.pane .sub { color: var(--mute); margin: 6px 0 28px; font-size: 16px; }

/* Dashboard Cards & Feed */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat {
  background: #ffffff;
  border-radius: 22px;
  padding: 22px;
  border: 1px solid var(--line);
  box-shadow: var(--sh-subtle);
}
.stat b { font-size: 38px; letter-spacing: -0.03em; display: block; line-height: 1.1; color: var(--ink); }
.stat span { color: var(--mute); font-size: 14px; font-weight: 550; }

.panel {
  background: #ffffff;
  border-radius: 26px;
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--sh-subtle);
}
.panel h3 { margin-bottom: 16px; }

.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 16px;
  transition: background 0.25s, transform 0.3s var(--e);
}
.row:hover { background: var(--alt); transform: translateX(4px); }
.row + .row { margin-top: 4px; }
.row .t { flex: 1; min-width: 0; }
.row small { color: var(--mute); display: block; font-size: 13px; }

.av {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--c, #0071e3);
  color: #ffffff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 16px;
  flex: none;
  overflow: hidden;
}
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.xl { width: 88px; height: 88px; font-size: 32px; border-radius: 26px; }

/* Posts Feed */
.pc {
  background: #ffffff;
  border-radius: 26px;
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--sh-subtle);
  animation: up 0.5s var(--e);
}
.post-rail {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 0 2px 14px;
  scroll-snap-type: x mandatory;
  overscroll-behavior-inline: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.post-rail > .pc { flex: 0 0 min(82%, 460px); margin: 0; scroll-snap-align: start; }
.post-feed { display: grid; gap: 18px; }
.post-feed > .pc { margin: 0; }
.ph2 { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ph2 .t { flex: 1; min-width: 0; }
.ph2 small { color: var(--mute); display: block; font-size: 13px; }
.tg {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mute);
  background: var(--alt);
  padding: 4px 12px;
  border-radius: 9999px;
}
.post-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
.tx { font-size: 16px; line-height: 1.55; margin: 8px 0 16px; white-space: pre-wrap; word-break: break-word; color: var(--ink-secondary); }

/* Swipeable post media */
.ig {
  display: flex;
  gap: 8px;
  border-radius: 20px;
  overflow-x: auto;
  overflow-y: hidden;
  margin-bottom: 16px;
  scroll-snap-type: x mandatory;
  overscroll-behavior-inline: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.ig button {
  padding: 0;
  flex: 0 0 min(78%, 560px);
  max-width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  display: block;
  scroll-snap-align: center;
}
.ig.n1 button { flex-basis: 100%; }
.ig img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.6s var(--e);
}
.ig button:hover img { transform: scale(1.05); }

/* Work Cards */
.wg { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.wc {
  background: #ffffff;
  border-radius: 26px;
  padding: 24px;
  border: 1px solid var(--line);
  box-shadow: var(--sh-subtle);
  transition: transform 0.4s var(--e), box-shadow 0.4s var(--e);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.wc:hover { transform: translateY(-4px); box-shadow: var(--sh); }
.wc h3 { font-size: 21px; }
.wc p { margin: 0; color: var(--mute); font-size: 15px; line-height: 1.45; }

/* Links & Attachments */
.lk {
  display: flex;
  gap: 14px;
  align-items: center;
  background: var(--alt);
  border-radius: 16px;
  padding: 12px 16px;
  margin-bottom: 12px;
  transition: background 0.25s, transform 0.3s var(--e);
}
.lk:hover { background: var(--soft); transform: translateY(-2px); }
.lk span:last-child { min-width: 0; }
.lk b { display: block; font-size: 14.5px; }
.lk small { display: block; color: var(--mute); font-size: 13px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.li { width: 38px; height: 38px; border-radius: 12px; background: #ffffff; display: grid; place-items: center; flex: none; font-size: 18px; }

/* Filter Tabs */
.fl { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.fc {
  padding: 8px 18px;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 600;
  color: var(--mute);
  background: #ffffff;
  border: 1px solid var(--line);
  transition: all 0.2s var(--e);
}
.fc:hover { color: var(--ink); border-color: var(--line-strong); }
.fc.on { background: var(--ink); color: #ffffff; border-color: var(--ink); }

/* Action row */
.ac { display: flex; gap: 8px; }
.lb {
  padding: 8px 16px;
  border-radius: 9999px;
  font-size: 14px;
  color: var(--mute);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.25s, color 0.25s, transform 0.2s var(--e);
}
.lb:hover { background: var(--alt); color: var(--ink); }
.lb:active { transform: scale(0.94); }
.lb.on { color: var(--rose); }

/* Switch Toggle (Apple Settings Style) */
.sw {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  gap: 16px;
}
.sw:last-of-type { border-bottom: 0; }
.sw-info b { display: block; font-size: 15px; margin-bottom: 2px; }
.sw-info small { color: var(--mute); font-size: 13px; display: block; }
.toggle {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 32px;
  flex: none;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #e5e5ea;
  transition: .35s var(--e);
  border-radius: 34px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .35s var(--e);
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
input:checked + .slider { background-color: var(--green); }
input:checked + .slider:before { transform: translateX(20px); }

/* Forms & Inputs */
label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
input, textarea, select {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #ffffff;
  transition: border 0.2s, box-shadow 0.2s;
  font-size: 15.5px;
}
input:focus, textarea:focus, select:focus {
  outline: 0;
  border-color: var(--blue);
  box-shadow: 0 0 0 4px var(--soft);
}
.err { color: #d70015; font-size: 14px; min-height: 20px; margin: 10px 0 0; }
.hint { font-size: 13px; color: var(--mute); margin-top: 14px; }
.hint a { color: var(--blue); font-weight: 550; }

/* Modals & Overlays */
.ov {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: grid;
  place-items: center;
  padding: 20px;
  animation: fade 0.25s var(--e);
}
.md {
  background: #ffffff;
  border-radius: 30px;
  padding: 32px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow: auto;
  box-shadow: var(--sh-frame);
  animation: sheet 0.45s var(--e);
}
.md.wide { max-width: 600px; }
@keyframes fade { from { opacity: 0; } }
@keyframes sheet { from { opacity: 0; transform: translateY(28px) scale(0.96); } }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
  transform: translateX(-50%);
  background: var(--ink);
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 9999px;
  font-size: 14.5px;
  font-weight: 550;
  z-index: 300;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  animation: sheet 0.4s var(--e);
}

/* Footer */
footer {
  background: var(--alt);
  padding: 64px 0 40px;
  color: var(--mute);
  font-size: 14px;
  border-top: 1px solid var(--line);
}
footer .w { display: block; }
.fg {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 36px;
}
.fg h4 { margin: 0 0 14px; color: var(--ink); font-size: 14.5px; }
.fg a { display: block; margin: 9px 0; transition: color 0.2s; font-size: 14px; }
.fg a:hover { color: var(--ink); }
.fb {
  border-top: 1px solid var(--line);
  margin-top: 40px;
  padding-top: 24px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

/* Docs & Article Layout */
.doc { max-width: 760px; margin: 0 auto; padding: clamp(48px, 8vw, 90px) 24px 100px; text-align: left; }
.doc h1 { font-size: clamp(36px, 5.5vw, 56px); margin-bottom: 12px; }
.doc h3 { margin: 40px 0 12px; font-size: 22px; }
.doc p, .doc li { color: var(--ink-secondary); font-size: 17px; line-height: 1.65; }
.doc ul { padding-left: 22px; }
.back { color: var(--blue); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px; }

/* Responsive adjustments */
@media (max-width: 820px) {
  .nl { display: none; }
  .mob-btn { display: block; }
  .nav .w { padding: 0 16px; }
  .fg { grid-template-columns: 1fr 1fr; }
  .stk { grid-template-columns: 1fr; gap: 16px; align-content: center; }
  .txt { height: 26vh; }
  .vis { height: 42vh; }
  .chap { height: 280vh; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; min-height: 100svh; }
  .side { display: none; }
  .mobile-app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 62px;
    padding: 8px 16px;
    position: sticky;
    top: 0;
    z-index: 110;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .mobile-app-header .brand { gap: 4px; flex: none; }
  .mobile-app-header .brand .logo { width: 34px; height: 34px; }
  .mobile-app-header .brand-name { font-size: 22px; }
  .mobile-team-title { min-width: 0; margin-left: auto; display: flex; flex-direction: column; text-align: right; line-height: 1.2; }
  .mobile-team-title b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .mobile-team-title small { color: var(--mute); font-size: 10px; }
  .mobile-account { width: 36px; height: 36px; font-size: 13px; }
  .pane { padding-bottom: 120px; }
  .aud-detail-grid, .wg, .prod-grid, .sto { grid-template-columns: 1fr; }
  .tab2 {
    display: flex;
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    z-index: 100;
    justify-content: space-around;
    padding: 8px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--line);
    box-shadow: var(--sh-lg);
  }
  .tab2 button {
    display: grid;
    justify-items: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--mute);
    padding: 6px 14px;
    border-radius: 18px;
  }
  .tab2 button.on { background: var(--soft); color: var(--blue); }
  .tab2 b { font-size: 19px; font-weight: 400; }
}

@media (max-width: 560px) {
  .w { padding: 0 16px; }
  .hero { padding-top: 28px; }
  .cta { flex-direction: column; }
  .cta .btn,
  .nav-actions .btn { width: 100%; }
  .win-url {
    width: 100%;
    max-width: none;
    font-size: 11px;
  }
  .prod-body { padding: 0 18px 22px; }
  .prod-avatar-row { align-items: center; }
  .prod-grid { grid-template-columns: 1fr; }
  .frame { border-radius: 22px; }
}
@media (min-width: 821px) {
  .tab2 { display: none; }
}

/* Shared Collab community palette across public, auth, and workspace routes. */
body.editorial {
  --bg: #f7faf8;
  --alt: #eaf2ed;
  --alt-card: #ffffff;
  --ink: #1e332d;
  --ink-secondary: #435b53;
  --mute: #71847b;
  --line: rgba(30, 67, 56, 0.12);
  --line-strong: rgba(30, 67, 56, 0.24);
  --blue: #328270;
  --blue-hover: #286b5d;
  --blue-glow: rgba(50, 130, 112, 0.2);
  --soft: #e2f1e9;
  --soft-line: rgba(50, 130, 112, 0.2);
  --green: #328270;
  --green-soft: #e2f1e9;
  --amber: #d8864c;
  --amber-soft: #fff0e4;
  --rose: #cf6659;
  --purple: #7770b3;
  --purple-soft: #eeecfa;
  --glass: rgba(247, 250, 248, 0.92);
  background: var(--bg);
}
body.editorial h1,
body.editorial h2,
body.editorial .big,
body.editorial .prod-info h3,
body.editorial .doc h1 {
  font-family: var(--f);
  font-weight: 750;
  letter-spacing: 0;
}
body.editorial h2 { font-size: 48px; line-height: 1.08; }
body.editorial .big { font-size: 62px; line-height: 1.08; }
body.editorial .nav {
  background: rgba(247, 250, 248, 0.94);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
body.editorial .nav .w { position: relative; max-width: 1440px; height: 72px; }
body.editorial .nav .brand { position: static; transform: none; font-size: 23px; font-weight: 800; letter-spacing: 0; gap: 7px; }
body.editorial .nav .brand .logo { width: 48px; height: 48px; }
body.editorial .brand-name { font-size: 30px; }
body.editorial .brand .badge { font-size: 10px; }
body.editorial .nav .nl { margin-left: auto; margin-right: 22px; gap: 24px; color: var(--ink-secondary); }
body.editorial .nav .nav-actions { margin-left: 0; }
body.editorial .nav .btn,
body.editorial .btn {
  border-radius: 12px;
  background: var(--blue);
  color: #ffffff;
  box-shadow: none;
  padding: 12px 19px;
  transition: background 0.25s ease, color 0.25s ease, transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
}
body.editorial .btn:hover { background: var(--blue-hover); box-shadow: none; }
body.editorial .btn.g { background: #ffffff; color: var(--ink); border: 1px solid var(--line-strong); }
body.editorial .btn.g:hover { background: var(--alt); color: var(--ink); }
body.editorial .hero { min-height: auto; padding: 105px 0 88px; overflow: visible; }
body.editorial .hero .w { max-width: 1180px; }
body.editorial .hero .pill-intro { background: var(--soft); border: 1px solid var(--soft-line); color: var(--blue-hover); padding: 7px 13px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; border-radius: 999px; }
body.editorial .hero h1 {
  max-width: 980px;
  margin: 0 auto;
  font-size: 88px;
  line-height: 1.02;
  font-weight: 800;
}
body.editorial .gradient-text { background: none; color: var(--ink); -webkit-text-fill-color: currentColor; }
body.editorial .hero .lead { color: var(--ink-secondary); font-size: 19px; line-height: 1.65; max-width: 54ch; margin-top: 26px; }
body.editorial .hero .cta { margin-top: 28px; }
body.editorial .frame {
  max-width: 1020px;
  transform: none;
  margin-top: 70px;
  border-radius: 20px;
  border: 0;
  box-shadow: none;
  background: var(--alt);
}
body.editorial .window-bar { background: var(--alt); padding: 14px 20px; border-bottom-color: rgba(37, 38, 31, 0.1); }
body.editorial .dots, body.editorial .win-actions { display: none; }
body.editorial .win-url { background: transparent; width: auto; max-width: none; padding: 0; color: var(--ink-secondary); letter-spacing: 0.08em; font-size: 10px; text-transform: uppercase; }
body.editorial .prod-cover { height: 440px; }
body.editorial .frame.is-visible .prod-cover img { animation: editorial-image-enter 1.15s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
body.editorial .prod-cover-overlay { background: linear-gradient(0deg, rgba(20, 21, 17, 0.46), transparent 48%); }
body.editorial .prod-body { padding: 0 38px 34px; }
body.editorial .prod-avatar-row { margin-top: -38px; }
body.editorial .prod-avatar { border-radius: 18px; border-width: 3px; }
body.editorial .prod-info h3 { font-size: 40px; }
body.editorial .showcase-nav { overflow-x: auto; }
body.editorial .showcase-tab { border-radius: 10px; padding: 10px 14px; }
body.editorial .showcase-tab.on { background: var(--ink); }
body.editorial .prod-card { border-radius: 14px; background: var(--bg); }
body.editorial .prod-card img { border-radius: 10px; }
body.editorial .gwrap { display: none; }
body.editorial .sec { padding: 112px 0; }
body.editorial .sec.alt { background: var(--alt); }
body.editorial .aud-tab { border-radius: 12px; background: #ffffff; color: var(--ink-secondary); border-color: var(--line); }
body.editorial .aud-tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); box-shadow: none; }
body.editorial .aud-detail-box { border-radius: 18px; background: var(--bg); box-shadow: var(--sh-subtle); }
body.editorial .aud-problem, body.editorial .aud-solution { border-radius: 14px; }
body.editorial .frame2, body.editorial .sc, body.editorial .step, body.editorial .fq { border-radius: 16px; box-shadow: var(--sh-subtle); }
body.editorial .sc { border-color: var(--line); }
body.editorial .sc:hover { transform: translateY(-4px); box-shadow: var(--sh); }
body.editorial footer { background: var(--alt); }
body.editorial .md { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--sh-lg); }
body.editorial .auth-mark { color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; margin-bottom: 16px; }
body.editorial .demo-entry { margin: 20px 0; padding: 16px; border-radius: 14px; background: var(--alt); }
body.editorial .demo-entry .btn { background: var(--blue); color: #fff; border: 0; }
body.editorial .demo-entry p { margin: 9px 0 0; color: var(--mute); font-size: 12px; text-align: center; }
body.editorial .auth-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--mute); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
body.editorial .auth-divider::before, body.editorial .auth-divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
body.editorial .md input, body.editorial .md textarea, body.editorial .md select { border-radius: 10px; background: #fff; }
body.editorial .ti.on { background: var(--soft); color: var(--blue-hover); }
body.editorial .tab2 button.on { background: var(--soft); color: var(--blue-hover); }
body.editorial .ti > span,
body.editorial .tab2 b { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 9px; background: var(--alt); color: var(--ink-secondary); font-size: 11px; font-weight: 800; }
body.editorial .ti.on > span,
body.editorial .tab2 button.on b { background: var(--blue); color: #fff; }
body.editorial .pc, body.editorial .wc, body.editorial .panel, body.editorial .stat { border: 1px solid var(--line); }
body.editorial .stat { background: #fff; }
body.editorial .app { background: var(--alt); }
body.editorial .side { background: rgba(247, 250, 248, 0.96); }
body.editorial .pc, body.editorial .wc, body.editorial .panel, body.editorial .stat { border-radius: 16px; }
body.editorial .pc, body.editorial .wc, body.editorial .panel { background: #ffffff; }
body.editorial .tab2 { background: var(--bg); }
body.editorial [data-reveal] { opacity: 0; transform: translateY(32px); transition: opacity 0.85s ease, transform 0.95s cubic-bezier(0.2, 0.7, 0.2, 1); }
body.editorial [data-reveal].is-visible { opacity: 1; transform: none; }
body.editorial .scroll-shimmer {
  background-image: linear-gradient(105deg, var(--ink) 0%, var(--ink) 42%, #9bd9c5 50%, var(--ink) 58%, var(--ink) 100%);
  background-size: 220% 100%;
  background-position: 100% 0;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: heading-shimmer 1.1s ease-out;
}
@keyframes heading-shimmer { to { background-position: -25% 0; } }

.editorial-stories { background: var(--alt); padding: 110px 24px; overflow: hidden; }
.editorial-stories-inner { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 0.8fr 1.2fr; align-items: center; gap: 72px; }

function isLocalHost() {
  var h = location.hostname;
  return h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
}

function isPrivateNetworkHost() {
  var host = location.hostname.toLowerCase();
  if (host.endsWith('.local')) return true;
  var octets = host.split('.').map(Number);
  if (octets.length !== 4 || octets.some(function(part){ return !Number.isInteger(part) || part < 0 || part > 255; })) return false;
  return octets[0] === 10 ||
    (octets[0] === 192 && octets[1] === 168) ||
    (octets[0] === 172 && octets[1] >= 16 && octets[1] <= 31);
}

/* Dashboard Views */
function avt(u, extraClass) {
  return '<div class="av ' + (extraClass || '') + '" style="--c:#0071e3">' +
    (u && u.av ? '<img src="' + u.av + '" alt="">' : esc(((u && u.name) || '?')[0])) +
  '</div>';
}

/* Post Card Rendering (Supports Heading, Text, Photos, Links, Likes, Comments) */
function pc(p) {
  var au = S.users.find(function(x){ return x.email === p.email; }) || { name: p.name, av: '' };
  var own = S.user && (p.email === S.user.email || S.user.role === 'admin');
  var n = (p.img && p.img.length) || 0;

  return '<article class="pc" data-id="' + p.id + '">' +
    '<div class="ph2">' +
      avt(au) +
      '<div class="t"><b>' + esc(au.name) + '</b><small>' + p.t + '</small></div>' +
      '<span class="tg">' + esc(p.tag) + '</span>' +
      (own ? '<button class="ib delete-label" data-a="delp" aria-label="Delete post" title="Delete post" style="margin-left:auto;color:var(--mute)">Delete</button>' : '') +
    '</div>' +
    (p.title ? '<div class="post-title">' + esc(p.title) + '</div>' : '') +
    '<p class="tx">' + esc(p.text) + '</p>' +
    (n ? '<div class="ig n' + Math.min(n, 3) + '" role="group" aria-label="Post media gallery" tabindex="0">' +
      p.img.slice(0, 3).map(function(s) {
        return '<button type="button" data-a="lb"><img src="' + s + '" alt="Post media"></button>';
      }).join('') +
    '</div>' : '') +
    (p.link ? '<a class="lk" href="' + esc(p.link) + '" target="_blank" rel="noopener"><span class="li">URL</span><span><b>' + esc(p.link) + '</b><small>Verified artifact link</small></span></a>' : '') +
    '<div class="ac">' +
      '<button class="lb ' + (p.liked ? 'on' : '') + '" data-a="like" aria-pressed="' + Boolean(p.liked) + '">' + (p.liked ? 'Liked' : 'Like') + ' · ' + p.likes + '</button>' +
      '<button class="lb" data-a="cmt">Comments · ' + (p.cm ? p.cm.length : 0) + '</button>' +
    '</div>' +
    '<div class="cm" style="display:' + (p.open ? 'block' : 'none') + ';margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">' +
      ((p.cm && p.cm.length) ? p.cm.map(function(c) {
        return '<p style="margin:6px 0;font-size:14.5px"><b>' + esc(c[0]) + ':</b> ' + esc(c[1]) + '</p>';
      }).join('') : '<p style="color:var(--mute);font-size:13.5px;margin:4px 0">No comments yet. Start the thread.</p>') +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<input placeholder="Write a comment..." style="padding:10px 14px;font-size:14px">' +
        '<button class="btn sm" data-a="addc">Send</button>' +
      '</div>' +
    '</div>' +
  '</article>';
}

/* Dashboard Pane HTML (Home, Posts, Work with Pending/Launched/Research & file attach, Settings with Admin Privacy System) */
function paneHTML() {
  var t = S.tab, u = S.user;
  if (!u) return '';
  var isAdmin = u.role === 'admin';

  if (t === 'home') {
    var totalLikes = S.posts.reduce(function(acc, p){ return acc + p.likes; }, 0);
    return '<h2>Welcome back, ' + esc(u.name.split(' ')[0]) + '</h2>' +
      '<p class="sub">' + esc(S.tm.name) + ' snapshot & team velocity.</p>' +
      (S.ann.length ? '<div class="panel" style="background:var(--soft);border-color:var(--soft-line)">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b>Team Announcement</b><small style="color:var(--mute)">' + S.ann[0].t + '</small></div>' +
        '<p style="margin:0;font-size:15px">' + esc(S.ann[0].text) + '</p>' +
      '</div>' : '') +
      '<div class="stats">' +
        '<div class="stat"><b>' + S.work.length + '</b><span>Shipped Deliverables</span></div>' +
        '<div class="stat"><b>' + S.posts.length + '</b><span>Milestone Posts</span></div>' +
        '<div class="stat"><b>' + totalLikes + '</b><span>Endorsements</span></div>' +
      '</div>' +
      '<div class="home-latest-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">' +
        '<h3 style="margin:0">Latest Team Updates</h3>' +
        '<div class="home-latest-actions" style="display:flex;gap:8px">' +
          '<button class="btn sm" data-a="newpost">+ Post Update</button>' +
          '<button class="btn sm g" data-t="journey">View full timeline</button>' +
        '</div>' +
      '</div>' +
      (S.posts.length ? '<div class="post-rail" aria-label="Latest team posts">' + S.posts.slice(0, 3).map(pc).join('') + '</div>' : '<p style="color:var(--mute)">No posts yet. Share your first team milestone.</p>');
  }

  if (t === 'journey') {
    var filteredPosts = S.posts.filter(function(p){
      return S.postFilter === 'All' || p.email === u.email;
    });
    return '<div class="pane-heading" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<h2>Team Journey</h2>' +
      '<button class="btn sm" data-a="newpost">+ New Post</button>' +
    '</div>' +
    '<p class="sub">Your team’s chronological build-log with photos and verified proof.</p>' +
    '<div class="fl">' +
      '<button class="fc ' + (S.postFilter === 'All' ? 'on' : '') + '" data-a="postfilter" data-v="All">All Team Posts (' + S.posts.length + ')</button>' +
      '<button class="fc ' + (S.postFilter === 'Mine' ? 'on' : '') + '" data-a="postfilter" data-v="Mine">My Posts (' + S.posts.filter(function(p){ return p.email === u.email; }).length + ')</button>' +
    '</div>' +
    (filteredPosts.length ? '<div class="post-feed">' + filteredPosts.map(pc).join('') + '</div>' : '<div class="panel" style="text-align:center;padding:40px;color:var(--mute)">No posts found in this filter. Tap "+ New Post" to share progress.</div>');
  }

  if (t === 'work') {
    var filteredWork = S.work.filter(function(w){
      return S.workFilter === 'All' || w.st === S.workFilter;
    });
    return '<div class="pane-heading" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<h2>Deliverables & Proof</h2>' +
      '<button class="btn sm" data-a="addw">+ Add Project / Paper</button>' +
    '</div>' +
    '<p class="sub">Projects, research whitepapers, and active prototypes classified by stage.</p>' +
    '<div class="fl">' +
      ['All', 'Launched', 'Research', 'Pending'].map(function(st){
        var count = st === 'All' ? S.work.length : S.work.filter(function(w){ return w.st === st; }).length;
        return '<button class="fc ' + (S.workFilter === st ? 'on' : '') + '" data-a="workfilter" data-v="' + st + '">' + st + ' (' + count + ')</button>';
      }).join('') +
    '</div>' +
    (filteredWork.length ?
      '<div class="wg">' +
        filteredWork.map(function(w) {
          return '<div class="wc">' +
            '<div style="display:flex;justify-content:space-between;align-items:center">' +
              '<span class="pill ' + (w.st === 'Launched' ? 'g' : w.st === 'Pending' ? 'a' : 'p') + '">' + w.st + '</span>' +
              '<button class="ib delete-label" data-a="delw" data-id="' + w.id + '" aria-label="Remove deliverable" title="Remove deliverable" style="color:var(--mute)">Remove</button>' +
            '</div>' +

            '<p>' + esc(w.desc) + '</p>' +
            (w.link ? '<a class="lk" href="' + esc(w.link) + '" target="_blank" rel="noopener"><span class="li">URL</span><span><b>' + esc(w.link) + '</b><small>Live project link</small></span></a>' : '') +
            (w.file ? '<a class="lk" href="' + (w.file.url || '#') + '" target="_blank" download="' + esc(w.file.name) + '"><span class="li">FILE</span><span><b>' + esc(w.file.name) + '</b><small>' + esc(w.file.size) + ' · Click to download or view</small></span></a>' : '') +
          '</div>';
        }).join('') +
      '</div>' :
      '<div class="panel" style="text-align:center;padding:40px;color:var(--mute)">No deliverables currently in the ' + S.workFilter + ' stage.</div>'
    );
  }

  if (t === 'team') {
    return '<h2>Team Members</h2>' +
      '<p class="sub">' + S.users.length + ' active collaborators.</p>' +
      '<div class="panel">' +
        S.users.map(function(m) {
          return '<div class="row">' +
            avt(m) +
            '<div class="t"><b>' + esc(m.name) + '</b><small>' + esc(m.bio || m.email) + '</small></div>' +
            '<span class="pill ' + (m.role === 'admin' ? '' : 'g') + '">' + (m.role === 'admin' ? 'Admin' : 'Member') + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
      (isAdmin ?
        '<form class="panel" data-f="invite" novalidate>' +
          '<h3>Invite Collaborator</h3>' +
          '<label for="ie">Teammate Email Address</label>' +
          '<input id="ie" name="e" type="email" placeholder="colleague@domain.com">' +
          '<p class="err" role="alert"></p>' +
          '<button class="btn sm" style="margin-top:12px">Send single-use invite</button>' +
        '</form>' :
        '<p style="color:var(--mute);font-size:14px">Only team administrators can issue member invitations.</p>'
      );
  }

  if (t === 'settings') {
    return '<h2>Settings & Administration</h2>' +
      '<p class="sub">Configure your personal profile and manage team privacy gates.</p>' +

      /* Dedicated Admin Privacy System Controls */
      (isAdmin ?
        '<div class="panel" style="border: 1.5px solid var(--soft-line)">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
            '<span class="pill">Admin Control System</span>' +
            '<h3 style="margin:0">Team Privacy & Access Controls</h3>' +
          '</div>' +
          '<p style="color:var(--mute);font-size:14.5px;margin:0 0 16px">Control the exact boundary between what the public sees and what stays strictly internal.</p>' +

          '<div class="sw">' +
            '<div class="sw-info">' +
              '<b>Public Team Portfolio Page</b>' +
              '<small>When active, visitors can access your public portfolio at collab.app/team/' + esc(S.tm.slug) + '</small>' +
            '</div>' +
            '<label class="toggle">' +
              '<input type="checkbox" id="swPub" ' + (S.tm.pub ? 'checked' : '') + ' data-a="tog_pub">' +
              '<span class="slider"></span>' +
            '</label>' +
          '</div>' +

          '<div class="sw">' +
            '<div class="sw-info">' +
              '<b>Require Admin Approval for Public Posts</b>' +
              '<small>Prevent member milestone updates from displaying on public portfolio until reviewed.</small>' +
            '</div>' +
            '<label class="toggle">' +
              '<input type="checkbox" id="swAppr" ' + (S.tm.requireApproval ? 'checked' : '') + ' data-a="tog_appr">' +
              '<span class="slider"></span>' +
            '</label>' +
          '</div>' +

          '<div class="sw">' +
            '<div class="sw-info">' +
              '<b>Hide Research Drafts & Pending Work</b>' +
              '<small>Keep unreleased papers, patents, and in-progress prototypes visible to signed-in members only.</small>' +
            '</div>' +
            '<label class="toggle">' +
              '<input type="checkbox" id="swHide" ' + (S.tm.hidePending ? 'checked' : '') + ' data-a="tog_hide">' +
              '<span class="slider"></span>' +
            '</label>' +
          '</div>' +

          '<div class="sw">' +
            '<div class="sw-info">' +
              '<b>Search Engine Indexing (SEO Crawlability)</b>' +
              '<small>Permit Google and web crawlers to index your public portfolio. Turn off for stealth mode.</small>' +
            '</div>' +
            '<label class="toggle">' +
              '<input type="checkbox" id="swSeo" ' + (S.tm.seoIndex ? 'checked' : '') + ' data-a="tog_seo">' +
              '<span class="slider"></span>' +
            '</label>' +
          '</div>' +

          '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">' +
            '<label for="st_slug">Custom Vanity URL Slug</label>' +
            '<div style="display:flex;gap:10px;align-items:center">' +
              '<input id="st_slug" value="' + esc(S.tm.slug) + '" style="max-width:280px">' +
              '<button class="btn sm" data-a="saveslug">Update URL</button>' +
            '</div>' +
            '<small style="color:var(--mute);display:block;margin-top:6px">Your public address: <b>collab.app/team/' + esc(S.tm.slug) + '</b></small>' +
          '</div>' +
        '</div>' :
        '<div class="panel">' +
          '<h3>Team Privacy & Administration</h3>' +
          '<p style="color:var(--mute);margin:0">Institutional privacy toggles and member access policies are restricted to Team Administrators.</p>' +
        '</div>'
      ) +

      '<div class="panel">' +
        '<h3>My Profile</h3>' +
        '<div style="display:flex;gap:18px;align-items:center;margin-bottom:16px">' +
          avt(u, 'xl') +
          '<div>' +
            '<label class="btn sm g" for="avf" style="cursor:pointer;margin:0">Upload Photo</label>' +
            '<input id="avf" type="file" accept="image/*" hidden>' +
            '<p class="hint" style="margin:8px 0 0">PNG, JPG, or WebP up to 2 MB.</p>' +
          '</div>' +
        '</div>' +
        '<label for="sn">Full Name</label><input id="sn" value="' + esc(u.name) + '">' +
        '<label for="sb">Technical Bio</label><textarea id="sb" rows="3">' + esc(u.bio || '') + '</textarea>' +
        '<button class="btn sm" data-a="sprof" style="margin-top:16px">Save Profile</button>' +
      '</div>' +
      '<div class="panel">' +
        '<h3>Account Actions</h3>' +
        '<button class="btn sm g" data-a="out">Sign Out of Collab</button>' +
      '</div>';
  }

  return '';
}

        '<span class="brand-name">ollab</span>' +
      '</a>' +

      '<a class="brand" href="#/" aria-label="Collab home">' +
        '<img src="assets/logo.svg" class="logo" alt="">' +
        '<span class="brand-name">ollab</span>' +
      '</a>' +
      '<div style="background:var(--alt);padding:12px;border-radius:14px;margin-bottom:12px">' +
        '<b style="display:block;font-size:14px">' + esc(S.tm.name) + '</b>' +

      '</div>' +
      TABS.map(function(t) {

          '<span>' + t[1] + '</span> ' + t[2] +

    }).join('') +

V['/app'] = dash;

function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2400);
}

function closeM() {
  S.tempPostImg = '';
  S.tempWorkFile = null;
  document.querySelectorAll('.ov').forEach(function(o){ o.remove(); });
}

/* Event Delegation */
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('ov')) { closeM(); return; }
  var a = e.target.closest('[data-a]'), t = e.target.closest('[data-t]');

  if (t) {
    S.tab = t.dataset.t;
    var pane = $('#pane');
    if (pane) pane.innerHTML = paneHTML();
    document.querySelectorAll('.ti, .tab2 button').forEach(function(btn){
      btn.classList.toggle('on', btn.dataset.t === S.tab);
    });
    return;
  }

  if (!a) return;
  var act = a.dataset.a;

  if (act === 'mclose') closeM();
  if (act === 'newpost') openNewPostModal();
  if (act === 'addw') openAddWorkModal();

  if (act === 'mobtoggle') {
    var dr = $('#mobDrawer');
    if (dr) dr.style.display = (dr.style.display === 'flex' ? 'none' : 'flex');
  }

  if (act === 'demologin') {
    if (!demoEnabled()) return;
    S.user = S.users[0];
    location.hash = '#/app';
    toast('Demo only — not a real account. Refreshing the page signs you out.');
    return;
  }

  if (act === 'stoggle') {
    S.showcaseTab = a.dataset.st;
    $('#m').innerHTML = V['/']();
    initEditorialReveal();
  }

  if (act === 'audtoggle') {
    S.audTab = a.dataset.at;
    $('#m').innerHTML = V['/']();
    initEditorialReveal();
  }

  if (act === 'phototoggle') {
    var photoIndex = Number(a.dataset.photo);
    var photoStory = PHOTO_STORIES[photoIndex];
    if (!photoStory) return;
    S.photoStory = photoIndex;
    var photoFigure = $('#storyPhoto');
    if (photoFigure) {
      var photoImage = photoFigure.querySelector('img');
      photoFigure.classList.remove('swap');
      if (photoImage) {
        photoImage.src = photoStory.img;
        photoImage.alt = photoStory.alt;
      }
      $('#storyTitle').textContent = photoStory.title;
      $('#storyCopy').textContent = photoStory.copy;
      $('#storyNumber').textContent = '0' + (photoIndex + 1) + ' / 0' + PHOTO_STORIES.length;
      $('#storyCaption').textContent = photoStory.title;
      void photoFigure.offsetWidth;
      photoFigure.classList.add('swap');
      document.querySelectorAll('.story-index button').forEach(function(button) {
        var active = Number(button.dataset.photo) === photoIndex;
        button.classList.toggle('on', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }
  }

  if (act === 'workfilter') {
    S.workFilter = a.dataset.v;
    var pane = $('#pane');
    if (pane) pane.innerHTML = paneHTML();
  }

  if (act === 'postfilter') {
    S.postFilter = a.dataset.v;
    var pane = $('#pane');
    if (pane) pane.innerHTML = paneHTML();
  }

  if (act === 'sharelink') {

/* Form Handling */
document.addEventListener('submit', function(e) {
  e.preventDefault();
  var f = e.target, k = f.dataset.f, d = new FormData(f);
  var er = f.querySelector('.err');
  function bad(m){ if (er) er.textContent = m; }

  if (k === 'login') {
    var email = (d.get('e') || '').toString().trim().toLowerCase();
    var pw = d.get('p') || '';
    var sb = supabaseClient();
    if (!sb) {
      bad('Set supabaseUrl and supabasePublishableKey in config.js.');
      return;
    }
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function(res) {
      if (res.error) {
        bad('Incorrect email or password.');
        return;
      }
      applySession(res.data.session);
      var api = window.COLLAB_CONFIG.apiUrl;
      if (api) {
        fetch(api.replace(/\/$/, '') + '/api/auth/me', { headers: apiHeaders() }).catch(function() {});
      }
      location.hash = '#/app';
    });
    return;
  }

  if (k === 'signup') {
    var name = (d.get('n') || '').toString().trim();
    var email = (d.get('e') || '').toString().trim().toLowerCase();
    var pw = d.get('p') || '';
    if (name.length < 2) return bad('Please enter your full name.');
    if (!email.includes('@')) return bad('Please enter a valid email.');
    if (pw.length < 10) return bad('Password must be at least 10 characters.');
    var sbSu = supabaseClient();
    if (!sbSu) {
      bad('Set supabaseUrl and supabasePublishableKey in config.js.');
      return;
    }
    sbSu.auth.signUp({
      email: email,
      password: pw,
      options: { data: { full_name: name } }
    }).then(function(res) {
      if (res.error) {
        bad('Could not create the account. Try a different email or sign in.');
        return;
      }
      if (res.data.session) {
        applySession(res.data.session);
        location.hash = '#/app';
        return;
      }
      bad('Check your email to confirm the account, then sign in.');
    });
    return;
  }

  if (k === 'contact') {
    var cn = (d.get('n') || '').toString().trim();
    var cm = (d.get('m') || '').toString().trim();
    if (!cn || cm.length < 5) return bad('Please fill out all required fields.');
    bad('');
    f.innerHTML = '<div style="background:var(--soft);padding:24px;border-radius:18px;color:var(--blue);font-weight:600">' +
      'Thank you. Your message has been sent to our leadership team.' +
    '</div>';
    return;
  }

  if (k === 'invite') {
    var ie = (d.get('e') || '').toString().trim();
    if (!ie.includes('@')) return bad('Please enter a valid email address.');
    S.invites.push(ie);
    bad('');
    f.reset();
    toast('Single-use invite dispatched');
  }
});

/* 3D Motion Designer: Realistic Continuous 3D Geosphere with Specular Sunlight & Trajectory Beacons */
function initGlobe() {
  var c = document.getElementById('gl');
  if (!c) return;
  var ctx = c.getContext('2d'), W, dpr = Math.min(2, window.devicePixelRatio || 1);
  var ry = -1.2, rx = 0.38, base = 0.0035, iv = 0, drag = false, lx = 0, ly = 0;

  var TEAMS = [
    [28.6, 77.2, 'Delhi', 1],
    [6.5, 3.4, 'Lagos', 1],
    [-23.5, -46.6, 'São Paulo', 1],
    [52.5, 13.4, 'Berlin', 1],
    [1.35, 103.8, 'Singapore', 1],
    [37.8, -122.4, 'San Francisco', 1],
    [51.5, -0.1, 'London', 1],
    [35.7, 139.7, 'Tokyo', 1]
  ];

  var ARCS = [
    [0, 4], [0, 3], [1, 3], [2, 5], [5, 7], [6, 5], [7, 3], [4, 7]
  ];

  function ll(a, b) {
    a *= Math.PI / 180; b *= Math.PI / 180;
    return [Math.cos(a) * Math.sin(b), Math.sin(a), Math.cos(a) * Math.cos(b)];
  }
  var TN = TEAMS.map(function(t){ return ll(t[0], t[1]); });

  // Generate continent coordinate land points
  var LAND = [];
  var CONTINENTS = [
    [[-160, 65], [-120, 70], [-90, 70], [-70, 45], [-80, 25], [-105, 20], [-125, 45]], // N. America
    [[-75, 10], [-45, -5], [-40, -20], [-55, -45], [-70, -50], [-80, -10]], // S. America
    [[-10, 35], [30, 35], [35, -30], [20, -35], [10, 5], [-15, 15]], // Africa
    [[-5, 50], [25, 60], [35, 45], [15, 40], [0, 45]], // Europe
    [[40, 60], [130, 65], [140, 35], [100, 10], [75, 15], [50, 35]], // Asia
    [[115, -20], [150, -20], [145, -40], [115, -35]] // Australia
  ];

  function pointInPoly(pt, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1];
      var xj = poly[j][0], yj = poly[j][1];
      var intersect = ((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  for (var i = 0; i < 3400; i++) {
    var lat = (Math.random() - 0.5) * 160;
    var lon = (Math.random() - 0.5) * 360;
    for (var k = 0; k < CONTINENTS.length; k++) {
      if (pointInPoly([lon, lat], CONTINENTS[k])) {
        LAND.push(ll(lat, lon));
        break;
      }
    }
  }

  // Sparkling background stars
  var STARS = [];
  for (var si = 0; si < 75; si++) {
    STARS.push([Math.random(), Math.random(), Math.random() * 1.5 + 0.4, Math.random() * 0.6 + 0.2]);
  }

  function resize() {
    if (!c.isConnected) return;
    W = Math.max(280, Math.min(c.parentNode.clientWidth * 0.94, window.innerHeight * 0.48, 540));
    c.style.width = c.style.height = W + 'px';
    c.width = c.height = W * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rot(p) {
    var cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    var X = p[0] * cy + p[2] * sy;
    var Z = -p[0] * sy + p[2] * cy;
    var Y = p[1] * cx - Z * sx;
    Z = p[1] * sx + Z * cx;
    return [X, Y, Z];
  }

  function pr(q, R) {
    var f = 3.3 / (3.3 - q[2] * 0.55);
    return [W / 2 + q[0] * R * f, W / 2 - q[1] * R * f, f];
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, W);
    var R = W * 0.36, m = W / 2;

    // Atmospheric outer space glow
    var glow = ctx.createRadialGradient(m, m, R * 0.94, m, m, R * 1.34);
    glow.addColorStop(0, 'rgba(0, 113, 227, 0.28)');
    glow.addColorStop(0.5, 'rgba(0, 113, 227, 0.08)');
    glow.addColorStop(1, 'rgba(0, 113, 227, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(m, m, R * 1.34, 0, 7); ctx.fill();

    // Starfield scintillation
    STARS.forEach(function(st) {
      var op = st[3] * (0.6 + 0.4 * Math.sin(t / 800 + st[0] * 8));
      ctx.fillStyle = 'rgba(120, 160, 220, ' + op.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(st[0] * W, st[1] * W, st[2], 0, 7); ctx.fill();
    });

    // Realistic Planetary Ocean Base (Deep gradient with light reflection)
    var ocean = ctx.createRadialGradient(m - R * 0.35, m - R * 0.4, R * 0.05, m, m, R);
    ocean.addColorStop(0, '#ffffff');
    ocean.addColorStop(0.3, '#eaf2ff');
    ocean.addColorStop(0.7, '#bcd8fa');
    ocean.addColorStop(1, '#7eafe7');
    ctx.fillStyle = ocean;
    ctx.beginPath(); ctx.arc(m, m, R, 0, 7); ctx.fill();

    // Latitude & Longitude coordinate rings (3D wireframe mesh)
    ctx.strokeStyle = 'rgba(0, 113, 227, 0.12)';
    ctx.lineWidth = 1;
    for (var la = -60; la <= 60; la += 30) {
      ctx.beginPath();
      var first = true;
      for (var lo = 0; lo <= 360; lo += 10) {
        var pt = rot(ll(la, lo));
        if (pt[2] > 0.02) {
          var sp = pr(pt, R);
          if (first) { ctx.moveTo(sp[0], sp[1]); first = false; }
          else ctx.lineTo(sp[0], sp[1]);
        } else { first = true; }
      }
      ctx.stroke();
    }

    // High-Density Continent Landmass Points
    LAND.forEach(function(p) {
      var q = rot(p);
      if (q[2] < 0.02) return;
      var s = pr(q, R);
      var lit = Math.max(0, q[1] * 0.4 - q[0] * 0.4 + q[2] * 0.7);
      var sz = 2.0 * s[2];
      ctx.fillStyle = 'rgba(' + (10 + 20 * lit | 0) + ',' + (80 + 50 * lit | 0) + ',' + (180 + 40 * lit | 0) + ',' + (0.35 + 0.55 * q[2]).toFixed(2) + ')';
      ctx.fillRect(s[0] - sz / 2, s[1] - sz / 2, sz, sz);
    });

    // 3D Altitude Great-Circle Arcs Linking Cities
    ARCS.forEach(function(arc, k) {
      var p1 = TN[arc[0]], p2 = TN[arc[1]];
      ctx.beginPath();
      var active = false;
      for (var step = 0; step <= 25; step++) {
        var u = step / 25;
        var vx = p1[0] + (p2[0] - p1[0]) * u;
        var vy = p1[1] + (p2[1] - p1[1]) * u;
        var vz = p1[2] + (p2[2] - p1[2]) * u;
        var mag = Math.hypot(vx, vy, vz) || 1;
        var alt = 1 + 0.22 * Math.sin(Math.PI * u); // Elevated altitude arc
        var q = rot([vx / mag * alt, vy / mag * alt, vz / mag * alt]);
        if (q[2] > 0) {
          var s = pr(q, R);
          if (!active) { ctx.moveTo(s[0], s[1]); active = true; }
          else ctx.lineTo(s[0], s[1]);
        } else { active = false; }
      }
      ctx.strokeStyle = 'rgba(88, 86, 214, 0.45)';
      ctx.lineWidth = 1.3;
      ctx.stroke();

      // Traveling packet pulse along arc
      var pulseU = (t / 2800 + k * 0.22) % 1;
      var px = p1[0] + (p2[0] - p1[0]) * pulseU;
      var py = p1[1] + (p2[1] - p1[1]) * pulseU;
      var pz = p1[2] + (p2[2] - p1[2]) * pulseU;
      var pm = Math.hypot(px, py, pz) || 1;
      var pa = 1 + 0.22 * Math.sin(Math.PI * pulseU);
      var pq = rot([px / pm * pa, py / pm * pa, pz / pm * pa]);
      if (pq[2] > 0) {
        var ps = pr(pq, R);
        ctx.fillStyle = '#0071e3';
        ctx.beginPath(); ctx.arc(ps[0], ps[1], 3.2, 0, 7); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ps[0], ps[1], 1.5, 0, 7); ctx.fill();
      }
    });

    // Real-Time Global Team Beacons
    TEAMS.forEach(function(tn, i) {
      var q = rot(TN[i]);
      if (q[2] < 0.05) return;
      var s = pr(q, R);
      var pulse = (t / 1200 + i * 0.28) % 1;

      // Pulsing telemetry wave rings
      ctx.strokeStyle = 'rgba(0, 113, 227, ' + ((1 - pulse) * 0.65).toFixed(2) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(s[0], s[1], 4 + pulse * 18, 0, 7);
      ctx.stroke();

      // Core beacon
      ctx.fillStyle = '#0071e3';
      ctx.beginPath(); ctx.arc(s[0], s[1], 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s[0], s[1], 2, 0, 7); ctx.fill();

      // Floating City Label Capsule
      if (q[2] > 0.28) {
        ctx.font = '600 12px -apple-system, sans-serif';
        var tw = ctx.measureText(tn[2]).width;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(s[0] + 10, s[1] - 10, tw + 14, 20, 10);
        else ctx.rect(s[0] + 10, s[1] - 10, tw + 14, 20);
        ctx.fill();
        ctx.fillStyle = '#1d1d1f';
        ctx.fillText(tn[2], s[0] + 17, s[1] + 4);
      }
    });

    // Specular Sun Reflection & Planet Rim
    var sun = ctx.createRadialGradient(m - R * 0.38, m - R * 0.42, 0, m - R * 0.38, m - R * 0.42, R * 0.48);
    sun.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
    sun.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = sun;
    ctx.beginPath(); ctx.arc(m, m, R, 0, 7); ctx.fill();

    ctx.strokeStyle = 'rgba(0, 113, 227, 0.25)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(m, m, R, 0, 7); ctx.stroke();
  }

  function loop(t) {
    if (!c.isConnected) return;
    if (!drag) {
      ry += base + iv;
      iv *= 0.96;
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  c.onpointerdown = function(e) {
    drag = true; iv = 0; lx = e.clientX; ly = e.clientY;
    c.setPointerCapture(e.pointerId);
  };
  c.onpointermove = function(e) {
    if (!drag) return;
    var dx = (e.clientX - lx) * 0.008;
    ry += dx;
    rx = Math.max(-0.8, Math.min(0.8, rx + (e.clientY - ly) * 0.005));
    lx = e.clientX; ly = e.clientY;
  };
  c.onpointerup = c.onpointercancel = function() { drag = false; };

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);
}

/* Sticky Chapters Scroll Handler */
function updateChapters() {
  document.querySelectorAll('[data-chap]').forEach(function(c) {
    var r = c.getBoundingClientRect();
    var n = 3;
    var p = Math.max(0, Math.min(0.999, -r.top / (r.height - window.innerHeight)));
    var ix = Math.floor(p * n);

    c.querySelectorAll('.txt .slide, .vis .slide').forEach(function(slide, idx) {
      slide.classList.toggle('on', (idx % n) === ix);
    });
  });
}
window.addEventListener('scroll', updateChapters, { passive: true });

var revealObserver;
function initEditorialReveal() {
  if (revealObserver) revealObserver.disconnect();
  var elements = document.querySelectorAll('body.editorial [data-reveal]');
  if (!('IntersectionObserver' in window)) {
    elements.forEach(function(element){
      element.classList.add('is-visible');
      shimmerRevealHeadings(element);
    });
    return;
  }
  revealObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        shimmerRevealHeadings(entry.target);
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });
  elements.forEach(function(element){ revealObserver.observe(element); });
}

function shimmerRevealHeadings(element) {
  var headings = element.matches('h1, h2, h3, .big') ? [element] : element.querySelectorAll('h1, h2, h3, .big');
  Array.prototype.forEach.call(headings, function(heading) {
    heading.classList.remove('scroll-shimmer');
    void heading.offsetWidth;
    heading.classList.add('scroll-shimmer');
    setTimeout(function(){ heading.classList.remove('scroll-shimmer'); }, 1200);
  });
}

/* Routing */
function route() {
  var h = location.hash.slice(1) || '/', p = h.split('?')[0];
  if (p === '/app' && !S.user) {
    location.hash = '#/login';
    return;
  }
  if (!V[p]) p = '/';

  var isApp = p === '/app';
  document.body.classList.add('editorial');
  $('#nav').innerHTML = isApp ? '' : nav();
  $('#m').innerHTML = V[p]();
  $('#ft').innerHTML = isApp ? '' : foot();
  initEditorialReveal();
  window.scrollTo(0, 0);

  // Close mobile drawer on route change
  var dr = $('#mobDrawer');
  if (dr) dr.style.display = 'none';

}

window.addEventListener('hashchange', route);

function boot() {
  var sb = supabaseClient();
  if (!sb) {
    route();
    return;
  }
  sb.auth.getSession().then(function(res) {
    applySession(res.data && res.data.session);
    route();
  }).catch(function() { route(); });
}
boot();

})();
</script>
